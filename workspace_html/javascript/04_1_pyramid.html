<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let m = '+';
        let s = '_';
        // 1단계
        // +++++
        // console.log('+++++');
        let string = '';
        for (i = 1; i <= 5; i++) {
            string = string + '+';
        }
        console.log(string);

        // 2단계
        // +_+_+_+_+_
        string = '';
        for (i = 1; i <= 5; i++) {
            // string = string + p + s;
            string += m + s;
        }
        console.log(string);

        // 3단계
        /*
            +++++
            +++++
            +++++
        */
        for (i = 1; i <= 3; i++) {
            string = '';
            for (j = 1; j <= 5; j++) {
                string = string + m;
            }
            console.log(string);
        }

        // 4단계
        /*
            11111
            22222
            33333
            44444
            55555
        */
        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            for (j = 1; j <= 5; j++) {
                // string = string + j
                // 12345가 5번 출력, 의도와 다름.
                string = string + i
                //  i라인이 5번 출력되게.
            }
            console.log(string);
        }

        // 5단계
        /*
            1
            22
            333
            4444
            55555
        */
        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            // for (j = 1; j <= 5; j++) {
            //     string = string + i;
            // }
            // 위와 똑같은 코드. 당연히 실행결과가 같다. 어떻게 수정해야 할까?

            for (j = 1; j <= i; j++) {
                // 문자열에 i 문자 추가를 반복하는데 j가 i가 작거나 같다면.
                string = string + i;
            }
            console.log(string);
        }

        // 6단계
        /*
            +
            ++
            +++
            ++++
            +++++
        */

        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            // j는 1로 시작. j <= i, i = 1 => 1회 반복, +가 1개 담김.
            // 2일 때, j <= i, i = 2 => 2회 반복해서 +가 2개 담김. ...
            for (j = 1; j <= i; j++) {
                string += m;
            }
            console.log(string);
        }

        // 7단계
        /*
            11111
            2222
            333
            44
            5
        */

        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            // 아까 5단계 문제 출력할 때 이미 해봐서 바로 해결.
            // 이러면 i = 1일 때, j = i = 1, j가 5가 될 때까지
            // = 1을 5개 담음.
            // i = 2일 때, j = i = 2, j가 5가 될 때까지
            // = 2을 4개 담음.
            // i = 3일 때, j = i = 3, j가 5가 될 때까지
            // = 3을 3개 담음. ...
            for (j = i; j <= 5; j++) {
                string += i;
            }
            console.log(string);
        }

        // 8단계
        /*
            +____
            ++___
            +++__
            ++++_
            +++++
        */

        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            // for (j=i; j<=5; j++)
            // 6단계 참고.

            // 겉의 반복휫수 i까지 반복.
            // 그러니까 처음엔 i = 1이 들어가서 J <= 1일 때까지 j가 증가.
            // = 처음엔 +가 1회 출력.
            //  2번째 반복 i = 2. j <= 2
            // = +가 2회 출력...
            for (j = 1; j <= i; j++) {
                string += m;
            }
            // 문자 총 개수가 5개기 때문에 두 개 합이 5
            // 초회 5 - i = 5 - 1 = 4
            // = 4회 출력.
            // 2번째 5 - i = 5 - 2 = 3
            // = 3회 출력.
            for (k = 5 - i; k >= 1; k--) {
                string += s;
            }
            console.log(string);
        }

        // 9단계
        /*
            ____+
            ___++
            __+++
            _++++
            +++++
        */
        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            // 공백 점점 적은 횟수 출력.
            // 첫 반복: 5 - i(i=1) = 4
            // = _ 4개가 string에 쌓임.
            for (j = 5 - i; j >= 1; j--) {
                string += s;
            }
            // _와 +이 합쳐서 줄당 5회씩 출력이므로 j + k = 5가 돼야함.
            // 따라서, 5 - i + k = 5이므로 k = 1부터 i까지. 
            // 십자 마크 점점 많은 횟수 출력.
            // 첫 반복: + 1개가 string에 쌓임.
            for (k = 1; k <= i; k++) {
                string += m;
            }
            // 안쪽 for 반복문에서 문자열에 담긴 것들을 줄 단위로 출력.
            console.log(string);
        }

        // 10단계
        /*
            ____+
            ___+++
            __+++++
            _+++++++
            +++++++++
        */

        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            // 직전 9단계에서 공백으로 밀어줬던 만큼 밀어주고 시작.
            for (j = 5 - i; j >= 1; j--) {
                string += s;
            }
            // 9단계까지는 합쳐서 5개였지만 형태가 바뀜. 1, 3, 5, 7, ... 홀수의 형태이므로
            // 반복 횟수 * 2에서 1을 빼줌.
            for (k = 1; k <= i * 2 - 1; k++) {
                string = string + m;
            }
            // 문자열에 담은 것 출력.
            console.log(string);
        }
        // 11단계
        /*
            ____+____
            ___+++___
            __+++++__
            _+++++++_
            +++++++++
        */

        string = '';
        for (i = 1; i <= 5; i++) {
            string = '';
            // 위의 10단계 문제와 동일.
            for (j = 5 - i; j >= 1; j--) {
                string += s;
            }
            // 위의 10단계 문제와 동일.
            for (k = 1; k <= i * 2 - 1; k++) {
                string += m;
            }
            // 11단계에서 출력하고자 하는 피라미드에서 추가되는 우측 공백.
            // 배치만 오른쪽에 해주면 되므로 for 반복문만 하나 추가해주고 + 뒤에 배치해주면 된다.
            // 서순에 주의.
            for (l = 5 - i; l >= 1; l--) {
                string += s;
            }
            console.log(string);
        }

        // 12단계
        // 입력 받은 줄 수 대로 출력

        string = '';
        // let 변수 선언으로 prompt를 통해 값을 입력받고 변수에 저장.
        let pyinput = prompt("줄 수 입력");
        // 몇 회를 반복할지는 바깥쪽 for 반복문이 결정한다. i <= 종료 시점 = pyinput으로 설정.
        for (i = 1; i <= pyinput; i++) {
            string = '';
            // 시작할 때 공백 수. 반복될수록 점차 감소하기 때문에 증감 연산자 중 감소 연산자 -- 사용
            // 입력받은 값 - i(반복횟수), 언제까지? j가 1보다 크거나 같을 때까지만.
            for (j = pyinput - i; j >= 1; j--) {
                string += s;
            }
            // 딱히 바꿀 필요 없음.
            for (k = 1; k <= i * 2 - 1; k++) {
                string += m;
            }
            // 배치 순서만 달라진 것이므로 위와 동일.
            for (l = pyinput - i; l >= 1; l--) {
                string += s;
            }
            console.log(string);
        }

        // 13단계
        // 입력 받은 줄 수 대로 거꾸로 출력

        string = '';
        // 거꾸로 출력 = 바깥쪽 for 반복문의 시작, 종료조건을 서로 바꿔주고 반복될 때마다 감소하게끔 설정.
        for (i = pyinput; i >= 1; i--) {
            string = '';
            for (j = pyinput - i; j >= 1; j--) {
                string += s;
            }
            for (k = 1; k <= i * 2 - 1; k++) {
                string += m;
            }
            for (l = pyinput - i; l >= 1; l--) {
                string += s;
            }
            console.log(string);
        }

        // 14단계
        // 입력 받은 줄 수 대로 다이아몬드 출력
        // 12, 13단계 붙여서 출력하면 다이아몬드 형태

    </script>
</head>

</html>
