<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            for( 초기화식; 조건식; 증감식 )

            1. 초기화 식 실행 (맨 처음에 딱 한번만 실행, 생략 가능)
            2. 조건식이 거짓이 아니면 (생략 가능)
            3. 실행 블럭을 실행
            4. 증감식 실행 (생략 가능)
            5. "2."번의 조건식으로 가서 false일 때 까지 반복
        */
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // 1~5까지 합
        let a = 1;
        let sum = 0;
        sum = sum + 1;
        sum += 2;
        sum += 3;
        sum += 4;
        sum += 5;

        sum = 0;
        for (let i = 1; i <= 5; i++) {
            // sum += i;
            sum = sum + i;
        }

        // 문제1 5~1까지 출력
        for (let i = 5; i >= 1; i--) {
            console.log(i);
        }

        // 문제2 1~5까지 출력 하면서 홀 짝 표시
        // 예 : 1(홀)
        //      2(짝)

        let num;
        for (let i = 1; i <= 5; i++) {
            if (i % 2 == 0) {
                num = '(짝)';
            } else {
                num = '(홀)';
            }
            console.log(`${i}${num}`);
        }

        // 1~10 까지 홀수의 개수
        // 1부터 10까지 반복
        // 홀수 판단
        // 그때마다 카운트
        //      카운트? 변수에 몇개였는지 저장
        let cnt = 0;

        for (let i = 1; i <= 10; i++) {
            if (i % 2 != 0) {
                cnt++;
            }
            console.log(`${i}, 여기까지의 홀수 개수는 ${cnt}개`);
        }
        console.log(`홀수 개수는 ${cnt}개`);

        /*
            반복문 만드는 원리

            1. 반복 되는 것 찾기
                - ctrl c, v 했을 때 바뀌지 않는 것 찾기

            2. 반복 되지 않는 것의 규칙(패턴) 찾기.

            3. 규칙을 변수로 바꿔서 ctrl c, v해도 되게 바꾸기

            4. 시작 값 파악
            5. 종료 조건 파악

        */

        // 구구단
        // 2 * 1 = 2
        // 2 * 2 = 4

        for (let dan = 2; dan <= 9; dan++) {
            for (let i = 1; i <= 9; i++) {
                console.log(`${dan} X ${i} = ${dan * i}`);
            }
        }

        // 문제3
        // 주사위 하나의 모든 경우의 수를 출력하시오

        for (let i = 1; i <= 6; i++) {
            console.log(i);
        }

        // 문제4
        // 주사위 두 개의 모든 경우의 수를 출력하시오
        // 예 : [1,2] [2,1]

        for (let i = 1; i <= 6; i++) {
            for (let k = 1; k <= 6; k++) {
                console.log(`[${i}, ${k}]`);
            }
        }

        // 문제5
        // 주사위 두개로 나올 수 있는 합 별 조합
        // 예 : 
        /*
            합 2 : [1, 1]
            합 3 : [1, 2] [2, 1]
            합 4 : [1, 3] [2, 2] [3, 1]
        */

        /*  합 2 : [1, 1]
            합 3 : [1, 2] [2, 1]
            합 4 : [1, 3] [2, 2] [3, 1]
            합 5 : [1, 4] [2, 3] [3, 2] [4, 1]
            합 6 : [1, 5] [2, 4] [3, 3] [4, 2] [5, 1]
            합 7 : [1, 6] [2, 5] [3, 4] [4, 3] [5, 2] [6, 1]
            합 8 : [2, 6] [3, 5] ...
            합 sum++ : [i++, k(sum-i)--]
        */
        for (let sum = 2; sum <= 7; sum++) {
            for (let i = 1; i <= 6; i++) {
                for (let k = sum - i; k >= 1; k--) {
                    // if (sum != (i + k)) {

                    // } 
                    // else {
                    //     console.log(`합 ${sum} : [${i},${k}]`);
                    // }
                    if (sum == (i + k)) {
                        console.log(`합 ${sum} : [${i},${k}]`);
                    }
                    // console.log('-----------');
                    // sum에다 줘야 합이 바뀔 때마다 줄 쳐짐.
                }
            }
            console.log('-----------');
        }
        for (let sum = 8; sum <= 12; sum++) {
            for (let i = 2; i <= 6; i++) {
                for (let k = 6; k >= 1; k--) {
                    // if (sum != (i + k)) {

                    // } 
                    // else {
                    //     console.log(`합 ${sum} : [${i},${k}]`);
                    // }
                    if (sum == (i + k)) {
                        console.log(`합 ${sum} : [${i},${k}]`);
                    }
                }
            }
            console.log('-----------');
        }

        let hap9 = ""
        for (let k = 2; k <= 12; k++) {
            console.log('=-=-= 합이' + k + '인 것 =-=-=');
            // 주사위 두개 도는 곳
            for (let j = 1; j <= 6; j++) {
                for (let i = 1; i <= 6; i++) {
                    // 합이 k인 것만 출력
                    if (j + i == k) {
                        console.log('[' + j + ', ' + i + '] ')
                        if (k == 9) {
                            hap9 += '[' + j + ', ' + i + '] '
                        }
                    }
                }
            }
            console.log()
        }
        // console.log('합 k :' + hap9);

    </script>
