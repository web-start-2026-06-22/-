<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let j = 10;
        j = j + 1;
        j += 1;
        j++;

        j--;

        ++j;
        --j;

        let k = 10;
        k++;
        console.log('k++ 이후 :' + k);
        ++k;
        console.log('++k 이후 :' + k);

        k = 10;
        console.log('k++', k++);
        console.log('k', k);

        k = 10;
        console.log('++k', ++k);
        console.log('k', k);

        k = 10;
        let m = k++ + 1;
        // m? 11, k? 11
        k = 10;
        m = ++k + k++;
        //  m? 22 , k? 12
        console.log(`m: ${m}, k: ${k}`);

        k = 10;
        m = k-- + ++k - --k;
        console.log(`m: ${m}, k: ${k}`);

        console.log('----------------------');

        let boolA = true;
        let boolB = false;
        let result = boolA && boolB;
        console.log('and :', result);

        result = boolA || boolB;
        console.log('or :', result);

        console.log('!boolA', !boolA);

        console.log('같은가? ', boolA == boolB);
        console.log('같지 않은가? ', boolA != boolB);

        let n = 3;
        let o = "3";
        console.log("n == o", n == o);
        console.log(typeof n);
        console.log(typeof o);
        console.log("n === o", n === o);
        console.log("n !== o", n !== o);

        console.log(typeof o == 'string');

        let num = 2;
        result = (num % 2) == 0 ? '짝수' : '홀수';
        console.log(result);

        // 문제1
        // 난 돈이 10,000원 있음.
        // 1. 4,800원 피스타치오를 최대 몇 잔 살 수 있는가?
        // 2. 그리고 남는 돈은?

        let money = 10000;
        let pistachio = 4800;

        console.log('최대 몇 잔 :', parseInt(money / pistachio));
        console.log('남는 돈 :', money % pistachio);

        // 문제2
        // 올리브영에 꿀홍차가 8000원입니다.
        // 15% 세일!! 그렇다면 가격은?

        let honeytea = 8000;
        let discount = 0.85;

        console.log('할인된 가격 :', honeytea * discount);

        // 문제3
        // 1234를 10의 자리 이하 버림
        // 결과 : 1200

        let quiz3 = 1234;

        console.log('10의 자리 이하 버림 :', quiz3 - (quiz3 % 100));

        // 문제4
        // 두 값 1000, 794가 있을 때
        // 1000 / 794의 결과를 소수점 2자리 까지만 출력
        // 결과 : 1.25

        let quiz4_num1 = 1000;
        let quiz4_num2 = 794;

        console.log('1000 / 794의 결과를 소수점 2자리 까지만 :', parseInt((quiz4_num1 / quiz4_num2) * 100) / 100);

        // 문제5
        // 17,000원을 줄 때
        // 5천원과 1천원짜리 밖에 없을 때
        // 각각 몇 장씩 줄 수 있는가?
        // 단, 5천원부터 준다.

        let quiz5_total = 17000;
        let quiz5_money1 = 5000;
        let quiz5_money2 = 1000;

        console.log('가지고 있는 돈을 5천원과 천원으로 계산할 때 :', '5천원은', parseInt(quiz5_total / quiz5_money1), '장', '1천원은', parseInt((quiz5_total % quiz5_money1) / quiz5_money2), '장');


    </script>
</head>

<body>

</body>

</html>
