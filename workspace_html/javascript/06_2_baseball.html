        // 임의의 3자리 숫자인 정답이 있을 때

        /*
            예 : [123]이 정답일 때
            145 : 1스트라이크
            135 : 1스트라이크 1볼
            367 : 1스트라이크
            328 : 1스트라이크 1볼

        // 제곱 연산을 위한 함수.
        // 왜 만들었는가? 자릿수 별로 나눌 때나 합칠 때 사용하기 위해.
        function square(num, mul) {
            for (let i = 0; i < mul - 1; i++) {
                if (i != 0) {
                    result = result * num;
                } else {
                    result = num * num;
                }
                // // 테스트용 출력문
                // console.log(`현재 ${i + 1}번째 제곱 연산 중, 연산 결과는 ${result}.`);
            }
            if (mul == 1) {
                result = num * 1;
            }
            if (mul == 0) {
                result = 1;
            }
            return result;
        }

        // 랜덤 숫자 생성, start~end까지의 숫자 생성 함수
        function rand(start, end) {
            result = parseInt(Math.random() * end) + start;
            return result;
        }

        // 초기화 위한 함수.
        function clear(v) {
            if (typeof v == typeof 0) {
                v = -1;
            } else if (typeof v == typeof 'string') {
                v = '';
            } else if (typeof v == typeof [1, 2, 3, 4, 5]) {
                v = [];
            }
            return v;
        }

        // 사용자가 입력한 숫자를 배열로 변경해주기 위한 함수.
        function numToArr(input) {
            let numArray = [];
            let tempNum = 0;
            const inputNum = Number(input);
            input = String(input);
            for (let i = 0; i < input.length; i++) {
                // 3자리수일 때
                // 백의 자리: parseInt(3자리수 / 100 = 10 * 2)
                // 십의 자리: parseInt((3자리수 / 10 = 10 * 1) % 10 = 10 * 1)
                // 일의 자리: parseInt((3자리수 / 1(생략됨) = 10 * 0 ) % 10 = 10 * 1)

                // 4자리수일 때
                // 천의 자리: parseInt(4자리수 / 1000 = 100 * 3)
                // 백의 자리: parseInt((4자리수 / 100 = 10 * 2) % 10 = 10 * 1)
                // 십의 자리: parseInt((4자리수 / 10 = 10 * 1) % 10 = 10 * 1)
                // 일의 자리: parseInt((4자리수 / 1(생략됨) = 10 * 0) % 10 = 10 * 1)

                // 백의 자리 or 천의 자리. 제일 큰 자릿수 숫자 추출.
                if (i == 0) {
                    tempNum = parseInt(inputNum / square(10, (input.length - i - 1)));
                    numArray.push(tempNum);
                    // 테스트용
                    // console.log(`for 반복문의 현재 i는 ${i}, 현재 값은${tempNum}, 현재까지 변환된 배열은 ${numArray}입니다.`);
                } else {
                    tempNum = parseInt(inputNum / square(10, (input.length - i - 1))) % square(10, 1);
                    numArray.push(tempNum);
                    // 테스트용
                    // console.log(`for 반복문의 현재 i는 ${i}, 현재 값은${tempNum}, 현재까지 변환된 배열은 ${numArray}입니다.`);
                }

            }
            // 생성된 값 확인용
            // console.log(numArray);
            return numArray;
        }
