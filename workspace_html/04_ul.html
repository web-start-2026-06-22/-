<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title 태그는 글씨만 적는다. 주석도 출력된다.
     태그를 허용하지 않는 영역. 특별한 문법이 적용돼있어서 그렇다 하심-->
    <title>Document</title>
</head>
<body>
    <ul>
        <!-- 표현하고자 하는 내용은 <li> </li> 태그 안에 넣어야 한다. -->
        <li>아이템1</li>
        <li>아이템2</li>
        <!-- 아이템4 -->
        <li>아이템3</li>
        <li>
            <a href="http://naver.com" target="_blank">네이버</a>
        </li>
    </ul>
    <ol>
        <li>아이템1</li>
        <li>아이템2</li>
        <!-- 아이템4 -->
        <li>아이템3</li>
        <li>
            <a href="http://naver.com" target="_blank">네이버</a>
        </li>
    </ol>
    <ul>
        <li>리스트1</li>
        <li>
            <ul>
                <li>리스트2-1</li>
                <li>리스트2-2</li>
            </ul>
        </li>
    </ul>

    <dl>
        <!-- dt definition tag -->
        <dt>dl 태그</dt>
        <!-- dd definition description -->
        <dd>용어와 설명을 적는 구조</dd>
    </dl>
    
    <!-- ul>li*5 -->
    <!-- <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul> -->
</body>
</html>
