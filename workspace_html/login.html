<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- login 섹션으로 큰 덩어리를 묶어주고, form으로 감싼다. -->
    <!-- input을 받을 id, pw 들은 inline요소이기 때문에, div로 감싸서 진행. -->
    <!-- 또, password의 경우 type="password" 명시해주기. -->
    <!-- 입력값이 없을 때 어떤 값이 들어가야 할지, placeholder 주기. -->
    <div class="loginsection">
        <form method="get" action="http://127.0.0.1:5500/main.html">
            <!-- <h1>Welcome Back!</h1> -->
            <!-- 글씨 크기 같은 것들을 원활히 조정하기 위해 h1->p태그로 수정정-->
            <p>
                Welcome Back!
            </p>
            <div>
                <input type="text" placeholder="Email Address *">
            </div>
            <div>
                <input type="password" placeholder="Password *">
            </div>
            <div>

                <button type="submit">LOG IN</button>
            </div>
        </form>
    </div>
</body>

</html>
