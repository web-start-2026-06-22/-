        console.log(`숫자의 개수는 ${q4GPT_cnt}개`);

        // 괜찮은 방식이라 생각했는데 안 되는 듯. 일단 정석적인 풀이대로 가자.

        /*
        // 문제 5
        // [배열 + 반복문 + 조건문]
        //
        // 아래 배열에서 가장 큰 값을 찾으시오.
        //
        // let numbers = [7, 2, 15, 4, 9, 1];
        //
        // 결과:
        // 가장 큰 값 : 15
        //
        // 조건:
        // Math.max() 사용 금지
        //
        // 힌트:
        // 변수 하나를 만들어서
        // 현재 가장 큰 값을 저장
        */

        let q5GPT_maximum = 0;

        let numbers = [7, 2, 15, 4, 9, 1];

        // 이건 간단하다.
        // for length - 1까지 돌리고.
        // 돌리면서 if numbers[i], numbers[i+1] 비교하면서 큰 수를 g5GPT_mximum에 덮어쓰기
        // for 반복문이 끝나면 저장된 값 출력.

        for (let i = 0; i < numbers.length - 1; i++) {
            // 아직 값이 들어있지 않은 상태에서만
            // q5GPT_maximum == 0 일 때를 바깥 큰 범위의 if로 묶고
            // if (q5GPT_maximum == 0 && (numbers[i] > numbers[i + 1])) {

            // } else if (q5GPT_maximum == 0 && (numbers[i] < numbers[i + 1])) {
            //     q5GPT_maximum = numbers[i + 1];
            // }
            if (q5GPT_maximum == 0) {
                // 처음 두 수 비교.
                if (numbers[i] > numbers[i + 1]) {
                    q5GPT_maximum = numbers[i];
                }
                if (numbers[i] < numbers[i + 1]) {
                    q5GPT_maximum = numbers[i + 1];
                }
            } else { // 처음 두 수 비교 후 = number[i + 1]이랑만 비교하면 된다.
                if (q5GPT_maximum < numbers[i + 1]) { // 다음 수가 더 큰 경우
                    q5GPT_maximum = numbers[i + 1];
                } else { // 기존 수가 더 클 경우 그대로.
                    q5GPT_maximum = q5GPT_maximum;
                }
            }
        }
        console.log(`가장 큰 값 : ${q5GPT_maximum}`);
