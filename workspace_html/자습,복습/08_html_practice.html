<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 로그인 할 때 아이디, 비밀번호 입력할 input field 규격 지정 */
        .login [type=text] {
        width: 290px;
        height: 50px;
        border-radius: 10px;
        border: 1px solid silver;
       }
       /* 로그인 버튼 css */
       [value=로그인] {
        width: 290px;
        height: 30px;
        background-color: silver;
        border-radius: 5px;
        border: 1px solid silver;
        color: white;
       }

       /* 비밀번호 찾기, 아이디 찾기, 회원가입 텍스트 모두 변경하기 위함 */
       a[href] {
        color: silver;
       }
       /* 체크박스 옆에 붙은 텍스트의 색상을 변경하가 위해 <span> 태그 활용. */
       [type=checkbox] + span {
        color: gray;
       }
        
    </style>
</head>

<body>
    <!-- form 안에 테이블을 작성하는 형태로 코드를 구성해봤는데,
     테이블 안에 form문을 작성하는 형태로 코드를 구성하면 어떻게 될까? 그런 건 어떨 떄 쓸 수 있을까?
     <tr></tr> 태그 영역에 작성할 경우, 해당 라인 영역에만 input type, button type, select, textarea를 사용 가능.
     <td></td> 태그 영역에 작성할 경우, 마찬가지로 해당 셀, 칸 영역에만 사용 가능할 것. -->
    <form>
        <table>
            <tr>
                <th colspan="3" width="300">
                    <h1>NAVER</h1>
                </th>
                <!-- <td></td>
                <td></td> -->
            </tr>
            <tbody>
                <tr>
                    <!-- 처음엔 라디오 버튼으로 구성해봤는데 a 태그도 괜찮을 듯. -->
                    <th><label><input type="radio" name="login_type" value="ID/telnum" checked>ID/전화번호</label></th>
                    <th><label><input type="radio" name="login_type" value="OTP">일회용 번호</label></th>
                    <th><label><input type="radio" name="login_type" value="QRcode">QR코드</label></th>
                </tr>
                <tr class="login">
                    <td colspan="3"><input type="text" name="ID" value="" placeholder="아이디 또는 전화번호"></td>
                    <!-- <td></td>
                    <td></td> -->
                </tr>
                <tr class="login">
                    <td colspan="3"><input type="text" name="PW" value="" placeholder="비밀번호"></td>
                    <!-- <td></td>
                    <td></td> -->
                </tr>
                <tr>
                    <td colspan="2"><label><input type="checkbox" name="login_status" value=""><span>로그인 상태 유지</span></label></td>
                    <!-- <td></td> -->
                    <td><label><input type="checkbox" name="IPsecurity" value=""><span>IP보안</span></label></td>
                </tr>
                <tr>
                    <th colspan="3"><label><input type="button" value="로그인"></label></th>
                    <!-- <td></td>
                    <td></td> -->
                </tr>
                <tr>
                    <!-- a 태그로도 해보기, 아래는 버튼으로 구성 -->
                    <!-- <td><label><input type="button" value="비밀번호 찾기"></label></td>
                    <td><label><input type="button" value="아이디 찾기"></label></td>
                    <td><label><input type="button" value="회원가입"></label></td>     -->
                    <!-- a 태그 -->
                    <td><a href="">비밀번호 찾기</a></td>
                    <td><a href="">아이디 찾기</a></td>
                    <td><a href="">회원가입</a></td>    
                </tr>
            </tbody>
        </table>
    </form>
</body>

</html>
