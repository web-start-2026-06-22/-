<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hidden {
            /* 공간은 남아있고 텍스트나 그런 요소들만 가려줌. */
            visibility: hidden;
        }
        .none {
            /* 공간까지 없애줌 */
            display: none;
        }
        .opacity {
            /* opacity: 0.3; */
            opacity: 0;
        }
    </style>
</head>
<body>
    <p>첫번째</p>
    <p class="hidden">두번째</p>
    <p class="none">세번째</p>
    <p class="opacity">네번째</p>
    <p>다섯번째</p>
</body>
</html>
