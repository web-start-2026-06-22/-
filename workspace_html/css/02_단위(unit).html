<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            px : pixel의 약자. 디스플레이의 절대적인 크기
        */
        #pixel .box1 {
            /* font-size : 폰트 크기, 상속됨. */
            font-size: 16px;

            /* 상속이 되진 않음 컬러는 */
            background-color: rgb(255, 0, 0);

            /* 16진수로 표기: 상속이 되는 컬러 */
            /* 클라우드 댄서 */
            color : #F0EEE9;
        }

        #pixel .box1 .box2 {
            font-size: 32px;

            /* background-color: rgb(0, 0, 255); */
            background-color: rgba(0, 0, 255, 0.4);
        }

        #pixel .box1 .box2 .box3 {
            font-size: 16px;
            background-color: #00FF00a0;
        }

        /* percent: 상대적인 크기. 상속됨.
        사용환경에 관계없이 ui 크기가 비율대로 가기 때문에 너비나 높이 같은 규격 지정할 때 자주 사용
        = 반응형 웹디자인에 용이 */

        #percent .box1 {
            font-size: 150%;
        }

        #percent .box1 .box2 {
            font-size: 150%;
        }

        #percent .box1 .box2 .box3 {
            font-size: 150%;
        }

        /* em: 상대적인 크기. 상속됨. */
        #em .box1 {
            font-size: 1.5em;
        }

        #em .box1 .box2 {
            font-size: 1.5em;
        }

        /* rem: root em, body의 크기를 활용한다. */
        #em .box1 .box2 .box3 {
            font-size: 1.5rem;
        }

        /* #v1 {
            border: 1px solid green;
        } */
        /* id도 ,로 묶을 수 있음 */
        #v1,
        #v2,
        #v3,
        #v4 {
            border: 1px solid green;
            /* 여백, 간격 부여 */
            margin: 10px;
        }

        /* vh : viewport(화면)의 height(높이)를 1/100로 쪼갠 크기 
        height %, px 따위는 고정적인 규격 지정이라면 vh는 유동적인, 화면 상태에 맞게 자동 조정되는
        = 반응형 웹디자인에 적합 */
        #v1 {
            /* height: 10px; */
            height: 100vh;
        }
        /* vw : 화면의 width(너비)를 1/100로 쪼갠 크기 */
        #v2 {
            height: 20px;
            width: 50vw;
        }

        #v3 {
            height: 90vmin;
        }

        #v4 {
            height: 90vmax;
        }

    </style>
</head>

<body>
    기본글씨 abc ABC 123 Wi <br>
    <div id="pixel">
        <div class="box1">
            box1
            <div class="box2">
                box2
                <div class="box3">
                    box3
                </div>
            </div>
        </div>
    </div>
    <hr>
    <div id="percent">
        <div class="box1">
            box1-150%
            <div class="box2">
                box2-150%
                <div class="box3">
                    box3-150%
                </div>
            </div>
        </div>
    </div>
    <hr>
    <div id="em">
        <div class="box1">
            box1-1.5em
            <div class="box2">
                box2-1.5em
                <div class="box3">
                    box3-1.5rem
                </div>
            </div>
        </div>
    </div>

    <div id="v1"></div>
    <div id="v2"></div>
    <div id="v3"></div>
    <div id="v4"></div>

</body>

</html>
