<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>사원 테이블 조회</h1>
    <div>
        <a href="/empadd">
            <button type="button">추가</button>
        </a>
    </div>
    <table border="1">
        <thead>
            <th>사번</th>
            <th>사원명</th>
            <th>직책</th>
            <th>상급자 사번</th>
            <th>입사 일자</th>
            <th>급여</th>
            <th>보너스</th>
            <th>부서 번호</th>
        </thead>
        <tbody>
            {% if emp_list %}
                {% for emp in emp_list %}
                    <tr>
                        <td><a href="/detail/{{emp.empno}}">{{emp.empno}}</a></td>
                        <td>{{emp.ename}}</td>
                        <td>{{emp.job}}</td>
                        <td>{{emp.mgr}}</td>
                        <td>{{emp.hierdate}}</td>
                        <td>{{emp.sal}}</td>
                        <td>{{emp.comm}}</td>
                        <td>{{emp.deptno}}</td>
                    </tr>
                {% endfor %}
            {% endif %}
        </tbody>
    </table>
    {# {{emp_list}} #}
</body>
</html>
