<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}{% endblock %}
    </title>
    <style>
        .container{
            width: 1000px;
            margin: 0 auto;
        }

        .container header {
            border: 1px solid plum;
            height: 100px;
        }

        .container footer {
            border: 1px solid plum;
            height: 150px;
        }

        .container .wrap {
            display: flex;
        }

        .container .wrap .menu {
            border: 1px solid plum;
            width: 150px;
        }

        .container .wrap .main {
            border: 1px solid violet;
            background-color:lightblue;
            flex-grow: 1;
        }
        {% block css %}{% endblock %}
    </style>
</head>

<body>
    <div class="container">
        <!-- 파일 분리 -->
        <!-- <header>
            <div>logo, menu</div>
        </header> -->
        <!-- html 홈페이지를 쌩으로 가져올 수 있음. -->
        <!-- 전달 인자 같은 것으로 파일명을 받아올 수도 있겠지. -->
        {# 다른 html 가져오기 #}
        {% include 'header.html' %}

        <div class="wrap">
            <div class="menu">
                왼쪽 메뉴1- {{like}}<br>
                왼쪽 메뉴2<br>
                왼쪽 메뉴3<br>
                왼쪽 메뉴4
            </div>
            <div class="main">
                컨텐츠<br>
                <!-- block 시작 -->
                <!-- 클래스 상속, override처럼 작동. -->
                {# 자식이 덮어 쓸 블럭 #}
                {% block youtube %}
                    반갑습니다 여러분
                {% endblock %}
                <!-- block 끝 -->
            </div>
            <div>
                {% block star %}
                {% endblock %}
            </div>
            <div>
                {% block bookmark %}
                {% endblock %}
            </div>
            <div>
                {% block filter %}
                {% endblock %}
            </div>
        </div>
        <div>
            {% block macro %}
            {% endblock %}
        </div>
        <footer>
            <div>회사 정보</div>
        </footer>
    </div>
</body>

</html>
